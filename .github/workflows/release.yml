name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify tag matches pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pub_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          app_version="${pub_version%%+*}"
          expected_tag="v${app_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${app_version}." >&2
            exit 1
          fi
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build ad-hoc signed DMG
        run: ./tool/make_dmg.sh

      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          app='build/macos/Build/Products/Release/noteez.app'
          executable="$app/Contents/MacOS/noteez"
          codesign --verify --deep --strict "$app"
          architectures="$(lipo -archs "$executable")"
          [[ " $architectures " == *' arm64 '* ]]
          [[ " $architectures " == *' x86_64 '* ]]
          hdiutil verify dist/Noteez.dmg

      - name: Name artifacts and create checksum
        id: artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          dmg="dist/Noteez-${APP_VERSION}.dmg"
          checksum="${dmg}.sha256"
          mv dist/Noteez.dmg "$dmg"
          (
            cd dist
            shasum -a 256 "Noteez-${APP_VERSION}.dmg" > \
              "Noteez-${APP_VERSION}.dmg.sha256"
          )
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
          CHECKSUM: ${{ steps.artifacts.outputs.checksum }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$DMG#Noteez ${APP_VERSION} for macOS" \
            "$CHECKSUM#SHA-256 checksum" \
            --verify-tag \
            --title "Noteez ${APP_VERSION}" \
            --generate-notes \
            --notes 'This build is ad-hoc signed and not Apple-notarized yet. On first launch, macOS may require approval in System Settings → Privacy & Security.'
